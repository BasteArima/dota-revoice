# Релиз по тегу v*: zip с exe для Windows и универсальный .app для macOS.
# Версия в теге должна совпадать с version в Cargo.toml — по ней программа
# понимает, что вышло обновление.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Версия тега совпадает с Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "тег $GITHUB_REF_NAME, а в Cargo.toml $version"; exit 1; }
      - name: Сборка
        run: cargo build --release --bin dota_revoice
      - name: Упаковка
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/DotaRevoice | Out-Null
          Copy-Item target/release/dota_revoice.exe dist/DotaRevoice/DotaRevoice.exe
          Copy-Item README.md dist/DotaRevoice/
          Compress-Archive -Path dist/DotaRevoice -DestinationPath "DotaRevoice-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: DotaRevoice-*-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Сборка под Apple Silicon и Intel
        run: |
          cargo build --release --bin dota_revoice --target aarch64-apple-darwin
          cargo build --release --bin dota_revoice --target x86_64-apple-darwin
      - name: Универсальный .app
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=dist/DotaRevoice.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/dota_revoice" \
            target/aarch64-apple-darwin/release/dota_revoice \
            target/x86_64-apple-darwin/release/dota_revoice
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Подпись без сертификата: без неё macOS не запомнит разрешение на микрофон.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "DotaRevoice-$GITHUB_REF_NAME-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: DotaRevoice-*-macos.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DotaRevoice-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dota Revoice $GITHUB_REF_NAME" \
            --generate-notes
