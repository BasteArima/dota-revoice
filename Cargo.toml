[package]
name = "dota_revoice"
version = "0.3.1"
edition = "2024"
default-run = "dota_revoice"
description = "Любительская переозвучка героев Dota 2: запись фраз и сборка VPK-мода"
license = "GPL-3.0-only"
repository = "https://github.com/BasteArima/dota-revoice"

[dependencies]
anyhow = "1"
cpal = "0.15"
crc32fast = "1"
dirs = "6"
ebur128 = { version = "0.1", default-features = false }
eframe = "0.31"
egui-phosphor = "0.9"
hound = "3.5"
md-5 = "0.10"
mp3lame-encoder = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
ogg = "0.9"
opus-decoder = "0.1"
png = "0.17"
rfd = "0.15"
rubato = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac", "isomp4", "aac"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "vsnd_spike"
path = "src/bin/vsnd_spike.rs"

[target."cfg(windows)".dependencies]
winreg = "0.52"

# В opus-decoder есть сдвиги, которые в debug ловятся как переполнение,
# а в release работают как в libopus (проверено на tests/data). Ведём себя одинаково.
[profile.dev.package.opus-decoder]
overflow-checks = false
